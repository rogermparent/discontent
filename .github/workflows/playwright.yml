name: Playwright Tests

on:
  push:
    branches: [main, playwright]
  pull_request:
    branches: [main]

# Auth.js refuses to start without a secret (`MissingSecret`), and every
# sign-in in the recipe and portfolio suites went through the error page
# instead of the form until this was set — 30 of shard 3's 107 tests and 26 of
# portfolio's 84 in the first run against content-engine-test (#132,
# 2026-09-08). The value only signs session cookies for a server that lives as
# long as the job, so it is not a secret; docker-compose.test.yml passes the
# developer's own through from the host env for the same reason.
env:
  AUTH_SECRET: playwright-ci-only-not-a-secret

# A newer push to the same PR supersedes the run in flight; main's runs are
# never cancelled, so every merge keeps its record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runner time is shared and finite (concurrency is the cap on a public repo:
  # one full run is ~11 jobs). Each suite runs only when something it builds on
  # changed: a docs-only PR runs none of them, a recipe-only PR skips portfolio
  # and the demo. `packages/**`, the lockfile, the workspace and CI plumbing
  # still run everything. Only `lint` is a required check, and a skipped job
  # reports as skipped, so nothing here can block a merge.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      recipe: ${{ steps.filter.outputs.recipe }}
      portfolio: ${{ steps.filter.outputs.portfolio }}
      resume: ${{ steps.filter.outputs.resume }}
      demo: ${{ steps.filter.outputs.demo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # A file counts when it matches an include and none of the `!`
          # patterns — prose never triggers a suite.
          predicate-quantifier: some-with-excludes
          filters: |
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
              - 'scripts/check-playwright-image.sh'
              - 'Dockerfile.playwright'
              - '!**/docs/**'
              - '!**/README.md'
              - '!CLAUDE.md'
            recipe:
              - *shared
              - 'websites/recipe-website/**'
            portfolio:
              - *shared
              - 'websites/portfolio/**'
            resume:
              - *shared
              - 'websites/resume-builder/**'
            demo:
              - *shared

  test:
    name: Recipe (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: changes
    if: ${{ needs.changes.outputs.recipe == 'true' }}
    # 45, not 30: in #132's first run three of four shards were cancelled at
    # exactly 30 minutes while the fourth finished in 21 with 30 failures, so
    # 30 is inside the noise of a bad run and made that run inconclusive.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    container:
      # Must match @playwright/test in the workspace — Playwright refuses to run
      # against a mismatched browser bundle. This was pinned to v1.50.0-jammy
      # while Dockerfile.playwright used v1.59.1-noble and the two sites'
      # devDependencies disagreed with both. Every job's first step after
      # install now runs scripts/check-playwright-image.sh, which fails by name
      # when any tag here or in Dockerfile.playwright drifts from the resolved
      # version.
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v7

      - name: Configure git
        # The CI container carries no git identity, and `init.defaultBranch`
        # decides what a bundle clone checks out: `git-test-content/test-git.bundle`
        # holds only `refs/heads/main`, so a container defaulting to `master`
        # checks out nothing and git.spec fails on an empty page.
        run: |
          git config --global user.name "Playwright Tester"
          git config --global user.email "playwright@example.com"
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Enable pnpm
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the image matches @playwright/test
        working-directory: websites/recipe-website/editor
        run: ../../../scripts/check-playwright-image.sh

      - name: Run Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        working-directory: websites/recipe-website/editor
        run: |
          pnpm exec playwright test \
            --project=e2e \
            --project=mobile \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} \
            --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: websites/recipe-website/editor/blob-report
          retention-days: 14

  portfolio:
    name: Portfolio
    needs: changes
    if: ${{ needs.changes.outputs.portfolio == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v7

      - name: Configure git
        # The CI container carries no git identity, and `init.defaultBranch`
        # decides what a bundle clone checks out: `git-test-content/test-git.bundle`
        # holds only `refs/heads/main`, so a container defaulting to `master`
        # checks out nothing and git.spec fails on an empty page.
        run: |
          git config --global user.name "Playwright Tester"
          git config --global user.email "playwright@example.com"
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Enable pnpm
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the image matches @playwright/test
        working-directory: websites/portfolio/editor
        run: ../../../scripts/check-playwright-image.sh

      # Unsharded on purpose: portfolio's suite is a fraction of recipe's, so
      # four containers would spend more time starting up than testing.
      - name: Run Playwright tests
        working-directory: websites/portfolio/editor
        run: |
          pnpm exec playwright test \
            --project=e2e \
            --project=mobile \
            --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-portfolio
          path: websites/portfolio/editor/blob-report
          retention-days: 14

  # resume-builder's own suite (5 specs, 35 tests). Nothing ran it before
  # 40b, and it sat 7 red on main for at least an epic without anyone noticing
  # (agent-epic-39.md Te2). Production mode only: PLAYWRIGHT_BUILD=1 makes
  # playwright.config.ts run `next build --webpack` and then `next start` on
  # 3010 — one cell, not demo's dev/prod pair, because the suite is small and
  # runner concurrency is the budget. No AUTH_SECRET needed (the app has no
  # sign-in), but the workflow-level one is harmless.
  resume:
    name: Resume builder
    needs: changes
    if: ${{ needs.changes.outputs.resume == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v7

      - name: Configure git
        # git.spec asserts on the commits each create, update and delete
        # makes, so the container needs an identity first.
        run: |
          git config --global user.name "Playwright Tester"
          git config --global user.email "playwright@example.com"
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Enable pnpm
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the image matches @playwright/test
        working-directory: websites/resume-builder
        run: ../../scripts/check-playwright-image.sh

      - name: Run Playwright tests
        working-directory: websites/resume-builder
        env:
          PLAYWRIGHT_BUILD: "1"
        run: pnpm exec playwright test --project=e2e --reporter=list,html

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-resume
          path: |
            websites/resume-builder/playwright-report
            websites/resume-builder/test-results
          retention-days: 14

  # `packages/cms/demo` is the CMS's own suite — the only place the core is
  # exercised without a site's opinions on top of it. No job ran it, so it could
  # rot silently while both sites stayed green. Nine specs (create, read,
  # update, delete, git, pagination, references, aggregates, items), 109 tests,
  # ~3 minutes; this comment said five specs and 71 tests for several passes
  # after it stopped being true.
  #
  # Both server modes, as a matrix. `dev` is the suite's contract and the fast
  # cell; `prod` sets PLAYWRIGHT_BUILD=1, so playwright.config.ts runs
  # `next build --webpack` and then `next start` on 3011.
  #
  # The prod cell exists because F20 was invisible for six passes purely because
  # nothing here had ever run a production build — and when the first honest one
  # was finally run it was red. It is green at 109 now
  # (packages/cms/docs/incremental-regeneration.md §11.4), and this is what keeps
  # it that way. `fail-fast: false` so a red prod cell never hides a red dev one.
  #
  # Cost is the build: ~50s on top of a suite that is *faster* in prod than in
  # dev (no per-route compilation), well inside the 20-minute timeout, and it
  # runs beside recipe's shards rather than ahead of them.
  demo:
    name: CMS demo (${{ matrix.mode }})
    needs: changes
    if: ${{ needs.changes.outputs.demo == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, prod]
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v7

      - name: Configure git
        # git.spec asserts on commits the CMS makes, so the container needs an
        # identity before the suite can produce any.
        run: |
          git config --global user.name "Playwright Tester"
          git config --global user.email "playwright@example.com"
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Enable pnpm
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the image matches @playwright/test
        working-directory: packages/cms/demo
        run: ../../../scripts/check-playwright-image.sh

      - name: Run Playwright tests
        working-directory: packages/cms/demo
        env:
          # Empty on the dev cell: playwright.config.ts reads this as
          # `!!process.env.PLAYWRIGHT_BUILD`, and "" is falsy.
          PLAYWRIGHT_BUILD: ${{ matrix.mode == 'prod' && '1' || '' }}
        run: pnpm exec playwright test --project=e2e

  merge-reports:
    name: Merge sharded reports
    # Not when the shards were skipped: there would be no blobs to merge.
    if: ${{ !cancelled() && needs.changes.outputs.recipe == 'true' }}
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Recipe's shards only — the numeric pattern excludes
      # `blob-report-portfolio`. Merging it in would interleave two unrelated
      # suites into a single HTML report.
      - name: Download all blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-[0-9]*
          merge-multiple: true

      - name: Merge into a single HTML report
        working-directory: websites/recipe-website/editor
        run: pnpm exec playwright merge-reports --reporter=html,github ../../../all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: websites/recipe-website/editor/playwright-report
          retention-days: 14
