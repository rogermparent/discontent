name: Checks
run-name: Checks ${{ github.ref }}
on: [push]
permissions: read-all
# A newer push to the same branch supersedes the run in flight; main's runs are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Unit and typecheck run only when something they read changed, to spare
  # shared runner time (playwright.yml's `changes` job says more). `lint` is the
  # one required check and always runs: it is also what checks prose formatting.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      typecheck: ${{ steps.sites.outputs.typecheck }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          # `code` is anything but prose. The skill's SKILL.md is not prose
          # here: test/curatorSkill.test.ts reads it.
          filters: |
            code:
              - '**'
              - '!**/docs/**'
              - '!**/README.md'
              - '!CLAUDE.md'
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
              - '!**/docs/**'
              - '!**/README.md'
            recipe:
              - *shared
              - 'websites/recipe-website/**'
            portfolio:
              - *shared
              - 'websites/portfolio/**'
      # A job-level `if` cannot see `matrix`, so the matrix itself is built
      # from the sites that changed.
      - name: Sites to typecheck
        id: sites
        run: |
          sites=()
          if [ "${{ steps.filter.outputs.recipe }}" = true ]; then sites+=('"websites/recipe-website/editor"'); fi
          if [ "${{ steps.filter.outputs.portfolio }}" = true ]; then sites+=('"websites/portfolio/editor"'); fi
          echo "typecheck=[$(IFS=,; echo "${sites[*]}")]" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the merge base with main exists locally. A shallow
      # clone plus a fetch of main has main's tip but no common ancestor,
      # which is why this job used to diff against the tip.
      - name: Check out current branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Against the merge base, not main's tip: `--diff origin/main` linted
      # the whole main…branch gap (≈1200 files before promotion — eslint was
      # SIGKILLed on #136's run, and a formatting slip anywhere in the gap
      # failed every PR). The merge base limits it to the branch's own
      # changes; on main itself it is HEAD, and nothing is linted.
      - name: Run lint-staged on the branch's own changes
        run: pnpm exec lint-staged --diff "$(git merge-base origin/main HEAD)"

  # The unit suite gates `test/projectSecurity.test.ts` and
  # `test/resolveWithin.test.ts` — the tests the path-traversal argument rests
  # on. Nothing ran them before this job, so that argument was resting on
  # nothing. 96 tests, under two seconds; there is no cheaper check in the repo.
  unit:
    name: Unit tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run vitest
        run: pnpm test --run

  typecheck:
    name: Typecheck (${{ matrix.site }})
    needs: changes
    if: ${{ needs.changes.outputs.typecheck != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.typecheck) }}
    steps:
      - name: Check out current branch
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # `next build` typechecks as a side effect, but no job ran one, so type
      # errors could reach main freely. Recipe's tsconfig made that worse: its
      # `include` listed only `next-env.d.ts` and the two generated `.next` type
      # globs, omitting `**/*.ts` and `**/*.tsx` — a `tsc` there checked
      # essentially nothing. Both configs cover the source now.
      - name: tsc --noEmit
        working-directory: ${{ matrix.site }}
        run: pnpm typecheck
