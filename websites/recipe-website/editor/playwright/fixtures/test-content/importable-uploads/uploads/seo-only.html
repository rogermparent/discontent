<!doctype html>
<html>
  <head>
    <!--
      26c: a page with no Recipe JSON-LD — only its title, description and
      OpenGraph image — so the import falls back to the SEO metadata
      (`partial: true`) and the form says so.
    -->
    <title>Paper Plane Cocktail | Fixture Bar</title>
    <meta property="og:site_name" content="Fixture Bar" />
    <meta property="og:title" content="Paper Plane Cocktail" />
    <meta
      property="og:description"
      content="Equal parts bourbon, Aperol, amaro and lemon."
    />
    <meta
      property="og:image"
      content="http://localhost:3019/uploads/recipe-imported-image-566x566.png"
    />
  </head>
  <body>
    <h1>Paper Plane Cocktail</h1>
    <p>Equal parts bourbon, Aperol, amaro and lemon, shaken.</p>
  </body>
</html>
